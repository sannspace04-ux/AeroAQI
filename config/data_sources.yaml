sources:
  openaq:
    enabled: true
    fetch_mode: realtime
    base_url: https://api.openaq.org/v3
    realtime_lookback_hours: 48
    historical_start: '2022-01-01'
    historical_end: '2024-12-31'
    location_ids:
    - 235
    - 16
    - 17
    - 50
    - 103
    - 236
    - 2587
    - 5404
    - 5541
    - 5613
    - 5616
    - 5665
    - 5742
    - 6980
    - 6359
    parameters:
    - pm25
    - pm10
    - o3
    - no2
    - so2
    - co
    page_size: 1000
    request_timeout_sec: 30
    retry_attempts: 3
    retry_backoff_sec: 5
  openmeteo:
    enabled: true
    fetch_mode: realtime
    base_url: https://api.open-meteo.com/v1/forecast
    historical_base_url: https://archive-api.open-meteo.com/v1/archive
    air_quality_url: https://air-quality-api.open-meteo.com/v1/air-quality
    forecast_hours: 72
    historical_days: 365
    historical_start: '2022-01-01'
    hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - wind_speed_10m
    - wind_direction_10m
    - surface_pressure
    - precipitation
    - shortwave_radiation
    - boundary_layer_height
    pressure_level_variables:
    - temperature
    pressure_levels:
    - 925
    - 850
    - 700
    request_timeout_sec: 30
    retry_attempts: 3
    retry_backoff_sec: 5
  era5:
    enabled: true
    fetch_mode: historical
    single_level_dataset: reanalysis-era5-single-levels
    pressure_level_dataset: reanalysis-era5-pressure-levels
    area:
    - 33.0
    - 72.5
    - 27.0
    - 80.0
    grid:
    - 0.25
    - 0.25
    historical_start: '2022-01-01'
    historical_end: '2024-12-31'
    single_level_variables:
    - 2m_temperature
    - 2m_dewpoint_temperature
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - surface_pressure
    - total_precipitation
    - surface_solar_radiation_downwards
    - boundary_layer_height
    pressure_level_variables:
    - temperature
    - specific_humidity
    pressure_levels:
    - '700'
    - '850'
    - '925'
    format: netcdf
    download_dir: data/raw/era5
    request_timeout_sec: 600
    retry_attempts: 2
    retry_backoff_sec: 60
  firms:
    enabled: true
    fetch_mode: realtime
    base_url: https://firms.modaps.eosdis.nasa.gov/api/area/csv
    product: VIIRS_SNPP_NRT
    bbox: 73.0,27.5,80.0,33.0
    day_range: 2
    min_confidence: nominal
    expected_columns:
    - latitude
    - longitude
    - bright_ti4
    - scan
    - track
    - acq_date
    - acq_time
    - satellite
    - instrument
    - confidence
    - version
    - bright_ti5
    - frp
    - daynight
    request_timeout_sec: 60
    retry_attempts: 3
    retry_backoff_sec: 10
  gadm:
    enabled: true
    fetch_mode: static
    download_url: https://geodata.ucdavis.edu/gadm/gadm4.1/shp/gadm41_IND_shp.zip
    download_dir: data/raw/gadm
    levels_to_keep:
    - 1
    - 2
    force_download: false
    request_timeout_sec: 120
    retry_attempts: 2
    retry_backoff_sec: 15
