# =============================================================================
# Delhi NCR bounding box — used to filter gridded data (ERA5, Open-Meteo)
# =============================================================================
ncr_bounds:
  lat_min: 28.2
  lat_max: 29.0
  lon_min: 76.8
  lon_max: 77.6

# =============================================================================
# Fire source region bounding box
# Covers Punjab, Haryana, parts of UP and Rajasthan — the primary
# stubble-burning zones that transport smoke toward Delhi NCR.
# =============================================================================
fire_source_region:
  lat_min: 27.5
  lat_max: 33.0
  lon_min: 73.0
  lon_max: 80.0
  # Radius thresholds (km) for aggregating fire counts to each station
  radius_km:
    - 300
    - 500
