# =============================================================================
# config/stations.yaml
# =============================================================================
# Master list of Delhi NCR air quality monitoring stations.
#
# Sources:
#   - CPCB CAAQMS station list:
#     https://airquality.cpcb.gov.in/ccr_docs/caaqms_list_NCR.pdf
#   - OpenAQ location coordinates (cross-referenced via explore.openaq.org)
#
# IMPORTANT:
#   Coordinates listed here are sourced from published CPCB documents and
#   OpenAQ metadata.  Always cross-check against the CPCB PDF before
#   using for precise spatial analysis.
#
# FIELDS:
#   station_id    : unique internal ID used as the join key
#   name          : official station name
#   city          : city within Delhi NCR
#   state         : Indian state
#   latitude      : decimal degrees N (WGS-84)
#   longitude     : decimal degrees E (WGS-84)
#   openaq_id     : OpenAQ v3 location ID (verify at explore.openaq.org)
#   agency        : operating agency (DPCC = Delhi, UPPCB = UP, HSPCB = Haryana)
#   zone          : directional zone within NCR (used for transport analysis)
#   active        : true if station is currently operational
# =============================================================================

